<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <title>3ASYWEALTH — Your net worth, finally clear · 3ASY.APP</title>
    <meta
      name="description"
      content="A free, private tool to understand your net worth: what you own, what you owe, your real share, and snapshots over time. No account, no server — your data stays in your browser."
    />
    <meta name="author" content="Michele Miky Monti" />
    <link rel="canonical" href="https://wealth.3asy.app/" />

    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://wealth.3asy.app/" />
    <meta property="og:site_name" content="3ASY.APP" />
    <meta property="og:title" content="3ASYWEALTH — Your net worth, finally clear" />
    <meta
      property="og:description"
      content="What you own, what you owe and your real share. No account, no server: everything stays in your browser."
    />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#fbfaf7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#131211" media="(prefers-color-scheme: dark)" />
    <meta name="apple-mobile-web-app-title" content="3ASYWEALTH" />

    <script>
      // Apply the saved theme before first paint to avoid a light/dark flash.
      try {
        var t = localStorage.getItem('3asywealth-theme')
        var dark = t === 'dark' || ((!t || t === 'system') && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.classList.add(dark ? 'dark' : 'light')
      } catch (e) {}
    </script>

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "3ASYWEALTH",
        "url": "https://wealth.3asy.app",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any",
        "offers": { "@type": "Offer", "price": "0", "priceCurrency": "EUR" },
        "author": { "@type": "Person", "name": "Michele Miky Monti" },
        "isPartOf": { "@type": "WebSite", "name": "3ASY.APP", "url": "https://www.3asy.app" }
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>3ASYWEALTH needs JavaScript: all calculations happen in your browser.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
